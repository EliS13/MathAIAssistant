<!doctype html>
<html lang="en" class="popup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marking Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Marking Assistant</h1>
  </header>

  <main>
    <section class="section">
      <label class="field">
        <span>Student name</span>
        <input id="student" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>Assignment</span>
        <input id="assignment" type="text" autocomplete="off">
      </label>
    </section>

    <section class="section">
      <h2>Checker</h2>
      <div id="files"></div>
      <p id="program" class="muted program"></p>
      <button id="start" class="btn primary" type="button" disabled>Start</button>
      <div id="result" aria-live="polite"></div>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="url-parser.js"></script>
  <script src="page-reader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
